<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Christodoulos C. Chamzas</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312355b'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23f4efe6'%3ECC%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #f7f4ee; --ink: #1c2430; --muted: #5b6573; --brand: #12355b; --accent: #b5532e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e141c; --ink: #e6e9ee; --muted: #9aa5b4; --brand: #9cc3ee; --accent: #e08a62; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; padding: 24px; }
  main { max-width: 520px; text-align: center; }
  .code { font: 700 clamp(4rem, 14vw, 7rem)/1 Georgia, serif; color: var(--brand); letter-spacing: -.03em; }
  h1 { font: 600 1.4rem Georgia, serif; margin: 12px 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; }
  a { display: inline-block; padding: 10px 20px; border-radius: 999px; background: var(--brand); color: var(--bg); text-decoration: none; font-weight: 600; }
  a:hover { background: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Page not found · Η σελίδα δεν βρέθηκε</h1>
  <p>The page you are looking for does not exist or has moved.<br>Η σελίδα που αναζητάτε δεν υπάρχει ή έχει μετακινηθεί.</p>
  <a href="./" id="home">Christodoulos C. Chamzas · Home</a>
</main>
<script>
  // On github.io project sites the home page lives under /<repo>/; on a custom domain it is /.
  document.getElementById('home').href = location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/')[1] + '/' : '/';
</script>
</body>
</html>
